<!DOCTYPE html>
<html lang="sl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minimax Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f6;--panel:#fff;--ink:#14202b;--mute:#66768a;--line:#e1e6ec;--line2:#cfd7e0;
  --side:#0f2a3d;--side2:#173a52;--side-ink:#c9d8e4;
  --acc:#0b8f7c;--acc-d:#08705f;--acc-l:#e3f4f0;
  --red:#c8383a;--red-l:#fbe9e9;--amb:#b7791f;--amb-l:#fdf1dc;--blu:#2a62c9;--blu-l:#e6eefb;--grn:#1f8a4c;--grn-l:#e2f5ea;
  --r:8px;--sh:0 1px 2px rgba(15,42,61,.06),0 4px 14px rgba(15,42,61,.05);
  --f:'Instrument Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0c1620;--panel:#132230;--ink:#e6edf3;--mute:#8fa3b5;--line:#22374a;--line2:#2c445a;
  --side:#08131c;--side2:#10202d;--side-ink:#a9bccb;--acc-l:#0f3a34;--red-l:#3b1b1d;--amb-l:#3a2d12;--blu-l:#15294a;--grn-l:#12351f;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,td.r,th.r,.kpi b{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-style:normal;font-size:16px}
.orgsel{margin:4px 14px 10px}
.orgsel select{width:100%;background:var(--side2);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:7px 8px}
nav{overflow:auto;flex:1;padding:0 8px 12px}
nav h6{margin:14px 10px 4px;font-size:11.5px;font-weight:600;color:#6f8ba1;letter-spacing:.02em}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;cursor:pointer;font-size:13.5px}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--acc);color:#fff;font-weight:600}
nav a .ic{width:18px;text-align:center;opacity:.9}
nav a .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.top .sp{flex:1}
.gs{position:relative;flex:0 1 340px;width:340px}
.gs input{width:100%;padding:8px 12px;border:1px solid var(--line2);border-radius:20px;background:var(--bg)}
.gsr{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);max-height:360px;overflow:auto;z-index:50}
.gsr a{display:block;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gsr a:hover{background:var(--acc-l)}
.gsr small{color:var(--mute)}
#page{flex:1;overflow:auto;padding:20px 22px 60px}
.btn.menubtn{display:none}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d);color:#fff}
.btn.dng{color:var(--red)}
.btn.dng:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{margin:0;font-size:20px;letter-spacing:-.01em}
.ph .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{padding:14px 16px;border-left:4px solid var(--acc)}
.kpi span{color:var(--mute);font-size:12.5px}
.kpi b{display:block;font-size:24px;margin-top:2px;letter-spacing:-.02em}
.kpi small{color:var(--mute)}
.kpi.red{border-color:var(--red)}.kpi.amb{border-color:var(--amb)}.kpi.blu{border-color:var(--blu)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{background:var(--bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--acc-l) 55%,transparent)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--bg)}
.tag{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.t-g{background:var(--grn-l);color:var(--grn)}.t-r{background:var(--red-l);color:var(--red)}.t-a{background:var(--amb-l);color:var(--amb)}.t-b{background:var(--blu-l);color:var(--blu)}.t-n{background:var(--line);color:var(--mute)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools input,.tools select,.f input,.f select,.f textarea{border:1px solid var(--line2);border-radius:6px;padding:7px 10px;background:var(--panel);width:100%}
.tools input,.tools select{width:auto}
.tools .grow{flex:1;min-width:180px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.f{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.f label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px;font-weight:500}
.f>div{grid-column:span 6}.f>.c3{grid-column:span 3}.f>.c4{grid-column:span 4}.f>.c8{grid-column:span 8}.f>.c12{grid-column:span 12}
.f textarea{min-height:64px;resize:vertical}
.mb{position:fixed;inset:0;background:rgba(8,19,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:100}
.md{background:var(--panel);border-radius:10px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.md.w{width:min(1080px,100%)}
.mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;flex:1;font-size:16px}
.mh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
.mbd{padding:18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--bg);border-radius:0 0 10px 10px}
.lines{width:100%;margin-top:6px}
.lines input,.lines select{width:100%;border:1px solid var(--line2);border-radius:5px;padding:5px 7px;background:var(--panel)}
.lines td,.lines th{padding:4px 5px}
.tot{margin-left:auto;width:320px;margin-top:10px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-size:17px;font-weight:700;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:300;box-shadow:var(--sh)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.bars .pair{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.bars .pair i{display:block;width:42%;max-width:20px;border-radius:3px 3px 0 0;min-height:1px}
.bars small{color:var(--mute);font-size:11px}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}.r{text-align:right}.b{font-weight:600}.pos{color:var(--grn)}.neg{color:var(--red)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);font-weight:500}
.tabs a.on{color:var(--acc);border-color:var(--acc)}
.list li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
.list{list-style:none;margin:0;padding:0}
.list li:last-child{border:0}
.note{background:var(--amb-l);color:var(--amb);border-radius:6px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
#printArea{display:none}
.doc{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;padding:26px 30px;font-size:12.5px}
.doc h1{font-size:22px;margin:0 0 4px}
.doc .hd{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}
.doc table{margin-top:10px}.doc th{background:#eef1f4;color:#333;position:static;border:1px solid #cdd3d9}.doc td{border:1px solid #cdd3d9;padding:5px 8px}
.doc .pay{border:1px solid #999;padding:10px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.doc .ft{margin-top:20px;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:6px}
.doc .tt{width:280px;margin-left:auto;margin-top:10px}.doc .tt div{display:flex;justify-content:space-between;padding:2px 0}.doc .tt .g{font-weight:700;font-size:15px;border-top:2px solid #111}
@media print{
  body{background:#fff}#app,.mb,.toast{display:none!important}
  #printArea{display:block}
}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:120;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .btn.menubtn{display:inline-flex}
  .gs{display:none}
  #page{padding:14px 12px 60px}
  .f>div,.f>.c3,.f>.c4,.f>.c8{grid-column:span 12}
  .tot{width:100%}
  .top{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.rep{font-size:11px}.rep .rh{display:flex;justify-content:space-between;border-bottom:2px solid #0f2a3d;padding-bottom:4px;margin-bottom:8px;font-size:12px}
.rep h1{font-size:20px;margin:6px 0 2px}.rep h2{font-size:15px;color:#0b8f7c;margin:14px 0 4px}.rep h3{font-size:12.5px;margin:10px 0 3px}
.rep .sub{color:#44566a;margin-bottom:4px}.rep p{margin:2px 0}
.rep .rt{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:10.5px}.rep .rt th{background:#0f2a3d;color:#fff;text-align:left;padding:4px 6px;border:1px solid #0f2a3d}
.rep .rt td{padding:3px 6px;border:1px solid #cdd3d9}.rep .rt td.r{text-align:right}.rep .rt tfoot td{font-weight:700;background:#eef1f4}
.rep .rt.kv{width:auto;min-width:50%}.rep .rt.kv th{background:#eef1f4;color:#111;font-weight:600;border:1px solid #cdd3d9}
.rep tr{page-break-inside:avoid}.rep thead{display:table-header-group}
.rep .note{background:#fdf1dc;border-left:4px solid #b7791f;padding:5px 9px;margin:6px 0}

.rep,.rep *,.doc,.doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><i>M</i>Minimax Pro</div>
    <div class="orgsel"><select id="orgsel" aria-label="Organizacija"></select></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <button class="btn menubtn" data-a="menu" aria-label="Meni">☰</button>
      <h1 id="ptitle"></h1><span class="sp"></span>
      <div class="gs"><input id="gsi" placeholder="Iskanje: stranke, računi, artikli …" autocomplete="off"><div class="gsr" id="gsr" hidden></div></div>
      <button class="btn sm" id="expbtn" data-a="expPage" title="Izvoz trenutne strani v PDF, Word ali CSV">⬇ Izvoz</button>
      <button class="btn sm tag" id="fsbtn" data-a="fsStatus"></button>
      <button class="btn" data-a="theme" title="Svetla / temna tema">◐</button>
    </div>
    <div id="page"></div>
  </main>
</div>
<div id="printArea"></div>
<script>
'use strict';
/* ================= Pomočniki ================= */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const addMonths=(s,n)=>{const d=new Date(s+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const fmt=n=>(+n||0).toLocaleString('sl-SI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fnum=(n,d=2)=>(+n||0).toLocaleString('sl-SI',{minimumFractionDigits:d,maximumFractionDigits:d});
const fd=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${+d}. ${+m}. ${y}`};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const ym=s=>s.slice(0,7);
const MESECI=['januar','februar','marec','april','maj','junij','julij','avgust','september','oktober','november','december'];
const MES3=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
const tag=(t,c='n')=>`<span class="tag t-${c}">${esc(t)}</span>`;
const money=(n,cls=true)=>`<span class="${cls?(n<0?'neg':''):''}">${fmt(n)}</span>`;

/* ================= Shramba ================= */
let ROOT=null,DB=null,MEMSTORE={};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return MEMSTORE[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){MEMSTORE[k]=v}},del:k=>{try{localStorage.removeItem(k)}catch(e){delete MEMSTORE[k]}}};
const KN0=[
['000','Neopredmetena sredstva'],['040','Oprema in druga opredmetena osnovna sredstva'],['049','Popravek vrednosti opreme'],
['100','Blagajna'],['110','Transakcijski račun (TRR)'],['120','Terjatve do kupcev'],['160','Vstopni DDV'],['180','Druge kratkoročne terjatve'],['190','Aktivne časovne razmejitve'],
['220','Obveznosti do dobaviteljev'],['230','Obveznosti za neto plače'],['231','Obveznosti za davke in prispevke iz plač'],['260','Obračunani DDV'],['265','Obveznost za DDV (poravnava)'],['280','Obveznosti za davek iz dobička'],['290','Pasivne časovne razmejitve'],
['900','Osnovni kapital / vložek'],['960','Preneseni čisti dobiček'],['985','Čisti dobiček/izguba obračunskega obdobja'],
['400','Stroški materiala'],['402','Stroški energije'],['403','Stroški pisarniškega materiala'],['410','Stroški storitev'],['412','Stroški najemnin'],['413','Stroški vzdrževanja'],['414','Stroški zavarovanj'],['415','Stroški reklame in reprezentance'],['416','Stroški telekomunikacij'],['417','Stroški računovodstva in svetovanja'],['419','Stroški bančnih storitev'],['420','Stroški službenih potovanj'],['431','Stroški amortizacije'],['470','Stroški plač'],['471','Stroški prispevkov delodajalca'],['472','Drugi stroški dela (regres, prevoz, prehrana)'],['469','Drugi stroški'],['460','Finančni odhodki'],
['760','Prihodki od prodaje storitev'],['762','Prihodki od prodaje blaga'],['764','Drugi prihodki'],['770','Finančni prihodki']
];
const newDB=()=>({v:2,settings:{company:{name:'',address:'',zip:'',city:'',country:'Slovenija',taxId:'',vatId:'',reg:'',iban:'',bic:'',bank:'',email:'',phone:'',web:'',logo:''},vatPayer:true,vatRates:[22,9.5,5,0],dueDays:15,footer:'Račun je izdan v elektronski obliki in velja brez žiga in podpisa.',theme:'light',counters:{},bankOpening:0,cashOpening:0,pay:{emp:22.1,er:16.1,meal:6.83,relief:5551.93,kmRate:0.43}},
partners:[],items:[],invoices:[],received:[],moves:[],cash:[],bank:[],employees:[],payrolls:[],assets:[],travel:[],recurring:[],journal:[],accounts:KN0.map(a=>({code:a[0],name:a[1]})),log:[]});
function migrate(){const d=newDB();for(const k in d){if(DB[k]===undefined)DB[k]=d[k]}for(const k in d.settings){if(DB.settings[k]===undefined)DB.settings[k]=d.settings[k]}for(const k in d.settings.company){if(DB.settings.company[k]===undefined)DB.settings.company[k]=d.settings.company[k]}for(const k in d.settings.pay){if(DB.settings.pay[k]===undefined)DB.settings.pay[k]=d.settings.pay[k]}}
function save(){ls.set('mmx_org_'+ROOT.cur,JSON.stringify(DB));ls.set('mmx_ts',String(Date.now()));FSY.dirty()}
function saveRoot(){ls.set('mmx_root',JSON.stringify(ROOT));ls.set('mmx_ts',String(Date.now()));FSY.dirty()}
function loadOrg(id){ROOT.cur=id;saveRoot();const raw=ls.get('mmx_org_'+id);DB=raw?JSON.parse(raw):newDB();migrate()}
function boot(){
  const raw=ls.get('mmx_root');
  if(raw){ROOT=JSON.parse(raw);loadOrg(ROOT.cur)}
  else{const id=uid();ROOT={cur:id,orgs:[{id,name:'Demo d.o.o.'}]};DB=newDB();seedDemo();saveRoot();save()}
  document.documentElement.dataset.theme=DB.settings.theme||'light';
}
const logA=t=>{DB.log.unshift({t:Date.now(),text:t});DB.log.length=Math.min(DB.log.length,300)};
const S=()=>DB.settings,CO=()=>DB.settings.company;
const pn=id=>{const p=DB.partners.find(x=>x.id===id);return p?p.name:'—'};
const gp=id=>DB.partners.find(x=>x.id===id)||{};
const acctName=c=>{const a=DB.accounts.find(x=>x.code===c);return a?a.name:c};

/* ================= UI stanje in usmerjevalnik ================= */
const UI={};const PAGES={};const ACT={};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const MS=[];
function modal(title,body,o={}){
  const el=document.createElement('div');el.className='mb';
  el.innerHTML=`<div class="md ${o.w?'w':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="x" data-a="mclose" aria-label="Zapri">×</button></div><div class="mbd">${body}</div>${o.foot?`<div class="mf">${o.foot}</div>`:''}</div>`;
  document.body.appendChild(el);MS.push(el);const f=$('input:not([type=hidden]),select,textarea',el);if(f&&!o.nofocus)f.focus();return el}
function closeModal(){const el=MS.pop();if(el)el.remove()}
const topModal=()=>MS[MS.length-1];
function formData(el){const o={};$$('[name]',el).forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:i.value});return o}

function crudForm(key,row,cb){
  const c=CR[key];const isNew=!row;row=row||c.blank();

  $('#cfsave',el).onclick=()=>{
    const d=formData(el);(c.num||[]).forEach(k=>d[k]=num(d[k]));

const DT={racun:'Račun',predracun:'Predračun',ponudba:'Ponudba',dobropis:'Dobropis',dobavnica:'Dobavnica'};

function calc(lines){const by={};let net=0,vat=0;(lines||[]).forEach(l=>{const n=r2((+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100));const v=r2(n*(+l.vat||0)/100);const k=String(+l.vat||0);by[k]=by[k]||{net:0,vat:0};by[k].net=r2(by[k].net+n);by[k].vat=r2(by[k].vat+v);net+=n;vat+=v});return{net:r2(net),vat:r2(vat),gross:r2(net+vat),by}}

const siRef=n=>'SI00 '+String(n).replace(/[^0-9-]/g,'');

/* ---- plače ---- */
function payCalc(p){
  const d=lastDay(p.month);const empP=LAW.v('pay.emp',d),erP=LAW.v('pay.er',d),br=LAW.v('pay.brackets',d),rl=LAW.v('pay.relief',d),mealD=LAW.v('pay.meal',d);
  const g=+p.gross||0;
  const cEmp=r2(g*empP/100),cEr=r2(g*erP/100),base=r2(g-cEmp);
  const inc=base*12;const relief=inc<=rl.limit?rl.base+(rl.c-rl.k*inc):rl.base;
  const annual=inc-relief-(+p.extraRelief||0);
  let tx=0,prev=0,rest=Math.max(0,annual);
  for(const [lm,r] of br){const lim=lm==null?Infinity:lm;const part=Math.min(rest,lim-prev);if(part<=0)break;tx+=part*r/100;rest-=part;prev=lim}
  const tax=p.noTax?0:r2(tx/12);
  const meal=r2((+p.mealDays||0)*mealD),trav=r2(+p.commute||0);
  const net=r2(base-tax+meal+trav);
  return{gross:g,cEmp,cEr,base,tax,meal,trav,net,cost:r2(g+cEr+meal+trav),empPct:empP,erPct:erP}}

/* ---- osnovna sredstva ---- */
const monthsTo=(a,d)=>{const p=a.date,y=+p.slice(0,4),m=+p.slice(5,7),y2=+d.slice(0,4),m2=+d.slice(5,7);return Math.max(0,(y2-y)*12+(m2-m))};
function assetCalc(a,d=today()){const mo=r2(a.cost*a.rate/100/12);const acc=Math.min(a.cost,r2(mo*monthsTo(a,d)));return{monthly:mo,acc,book:r2(a.cost-acc)}}

/* ---- dnevnik (samodejno knjiženje) ---- */
function journal(){
  const J=[];
  const add=(date,doc,desc,dr,cr,amt,src)=>{amt=r2(amt);if(!amt)return;if(amt<0){[dr,cr]=[cr,dr];amt=-amt}J.push({date,doc:doc||'',desc,dr,cr,amt,src:src||'auto'})};
  const y0=today().slice(0,4)+'-01-01';add(y0,'ZS','Začetno stanje TRR','110','900',S().bankOpening,'začetno');add(y0,'ZS','Začetno stanje blagajne','100','900',S().cashOpening,'začetno');
  DB.invoices.forEach(i=>{
    if(!['racun','dobropis'].includes(i.type)||i.cancelled)return;const s=sgn(i);const ds=(i.type==='dobropis'?'Dobropis ':'Izdani račun ')+pn(i.partnerId);
    (i.lines||[]).forEach(l=>{const it=DB.items.find(x=>x.id===l.itemId);const n=r2((+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100)),v=r2(n*(+l.vat||0)/100);
      const ac=(it&&it.account)||'760';add(i.date,i.number,ds,'120',ac,s*n);add(i.date,i.number,ds,'120','260',s*v)});
    (i.payments||[]).forEach(p=>add(p.date,i.number,'Plačilo računa – '+pn(i.partnerId),p.method==='gotovina'?'100':'110','120',p.amount))});
  DB.received.forEach(i=>{const ds='Prejeti račun '+pn(i.partnerId);
    (i.lines||[]).forEach(l=>{const n=r2((+l.qty||0)*(+l.price||0)),v=r2(n*(+l.vat||0)/100);const ac=l.account||'400';
      if(S().vatPayer){add(i.date,i.number,ds,ac,'220',n);add(i.date,i.number,ds,'160','220',v)}else add(i.date,i.number,ds,ac,'220',n+v)});
    (i.payments||[]).forEach(p=>add(p.date,i.number,'Plačilo prejetega računa – '+pn(i.partnerId),'220',p.method==='gotovina'?'100':'110',p.amount))});
  DB.cash.forEach(c=>{if(c.link)return;const a=c.konto||(c.type==='prejemek'?'764':'469');c.type==='prejemek'?add(c.date,c.number,c.desc,'100',a,c.amount,'blagajna'):add(c.date,c.number,c.desc,a,'100',c.amount,'blagajna')});
  DB.bank.forEach(b=>{if(b.link||!b.konto)return;b.amount>0?add(b.date,b.ref,b.desc,'110',b.konto,b.amount,'banka'):add(b.date,b.ref,b.desc,b.konto,'110',-b.amount,'banka')});
  DB.payrolls.forEach(p=>{const c=payCalc(p),d=lastDay(p.month),e=DB.employees.find(x=>x.id===p.employeeId);const ds='Plača '+(e?e.name:'')+' '+p.month;
    add(d,'PL-'+p.month,ds,'470','230',c.gross-c.cEmp-c.tax);
    add(d,'PL-'+p.month,ds+' – prispevki in davek delavca','470','231',c.cEmp+c.tax);
    add(d,'PL-'+p.month,ds+' – prispevki delodajalca','471','231',c.cEr);
    add(d,'PL-'+p.month,ds+' – prehrana in prevoz','472','230',c.meal+c.trav)});
  DB.assets.forEach(a=>{const now=today();const y0=+a.date.slice(0,4),y1=+now.slice(0,4);let prev=0;for(let y=y0;y<=y1;y++){const end=y<y1?`${y}-12-31`:now;const cum=assetCalc(a,end).acc;add(end,'AM-'+a.code,'Amortizacija '+a.name,'431','049',cum-prev,'amortizacija');prev=cum}});
  DB.journal.forEach(j=>add(j.date,j.doc,j.desc,j.dr,j.cr,j.amount,'ročno'));
  return J.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function ledger(J){const L={};(J||journal()).forEach(e=>{(L[e.dr]=L[e.dr]||{dr:0,cr:0}).dr+=e.amt;(L[e.cr]=L[e.cr]||{dr:0,cr:0}).cr+=e.amt});return L}
function plMonthly(year){const R=Array(12).fill(0),C=Array(12).fill(0);journal().forEach(e=>{if(e.date.slice(0,4)!==String(year))return;const m=+e.date.slice(5,7)-1;if(e.cr[0]==='7')R[m]+=e.amt;if(e.dr[0]==='7')R[m]-=e.amt;if(e.dr[0]==='4')C[m]+=e.amt;if(e.cr[0]==='4')C[m]-=e.amt});return{R,C}}
const bankBal=()=>r2(S().bankOpening+DB.bank.reduce((s,b)=>s+b.amount,0)+DB.invoices.reduce((s,i)=>s+(i.payments||[]).filter(p=>p.method!=='gotovina'&&!p.src).reduce((a,p)=>a+p.amount,0),0)-DB.received.reduce((s,i)=>s+(i.payments||[]).filter(p=>p.method!=='gotovina'&&!p.src).reduce((a,p)=>a+p.amount,0),0));
const cashBal=()=>r2(S().cashOpening+DB.cash.reduce((s,c)=>s+(c.type==='prejemek'?1:-1)*c.amount,0)+DB.invoices.reduce((s,i)=>s+(i.payments||[]).filter(p=>p.method==='gotovina'&&!p.src).reduce((a,p)=>a+p.amount,0),0)-DB.received.reduce((s,i)=>s+(i.payments||[]).filter(p=>p.method==='gotovina'&&!p.src).reduce((a,p)=>a+p.amount,0),0));
/* DDV obračun */
function vatReport(from,to){
  const out={},inn={};const ir=[],pr=[];
  DB.invoices.forEach(i=>{if(!['racun','dobropis'].includes(i.type)||i.cancelled||i.date<from||i.date>to)return;const s=sgn(i),c=tot(i);ir.push({i,c,s});for(const k in c.by){out[k]=out[k]||{net:0,vat:0};out[k].net+=s*c.by[k].net;out[k].vat+=s*c.by[k].vat}});
  DB.received.forEach(i=>{if(i.date<from||i.date>to)return;const c=tot(i);pr.push({i,c});for(const k in c.by){inn[k]=inn[k]||{net:0,vat:0};inn[k].net+=c.by[k].net;inn[k].vat+=c.by[k].vat}});
  const so=Object.values(out).reduce((s,x)=>s+x.vat,0),si=Object.values(inn).reduce((s,x)=>s+x.vat,0);
  return{out,inn,ir,pr,so:r2(so),si:r2(si),diff:r2(so-si)}}

const vatOpts=()=>S().vatPayer?S().vatRates:[0];
const blankLine=()=>({itemId:'',name:'',qty:1,unit:'kos',price:0,disc:0,vat:vatOpts()[0],account:'400'});
function lineRow(l,kind){
  const its=DB.items.map(i=>[i.id,(i.code?i.code+' · ':'')+i.name]);
  const it=`<td style="width:160px"><select data-c="item">${opt([['','— prosto vpisano —'],...its],l.itemId)}</select></td>`;
  const nm=`<td><input data-c="name" value="${esc(l.name)}" placeholder="Opis"></td>`;
  const q=`<td style="width:72px"><input data-c="qty" type="number" step="any" value="${l.qty}"></td>`;
  const un=`<td style="width:62px"><input data-c="unit" value="${esc(l.unit||'')}"></td>`;
  const pr=`<td style="width:100px"><input data-c="price" type="number" step="0.01" value="${l.price}"></td>`;
  const dc=`<td style="width:72px"><input data-c="disc" type="number" step="any" value="${l.disc||0}"></td>`;
  const vt=`<td style="width:78px"><select data-c="vat">${opt(vatOpts(),l.vat)}</select></td>`;
  const ac=`<td style="width:150px"><select data-c="account">${opt(DB.accounts.filter(a=>a.code[0]==='4'||a.code[0]==='0').map(a=>[a.code,a.code+' '+a.name]),l.account||'400')}</select></td>`;
  const am=`<td class="r num" data-c="amt" style="width:96px"></td><td style="width:34px"><button class="btn sm dng" data-a="lnDel" type="button">✕</button></td>`;
  return `<tr class="ln">${kind==='out'?it+nm+q+un+pr+dc+vt+am:it+nm+q+pr+vt+ac+am}</tr>`}
function linesTable(lines,kind){
  const head=kind==='out'?['Artikel','Opis','Kol.','EM','Cena','Popust %','DDV %','Znesek','']:['Artikel','Opis','Kol.','Cena','DDV %','Konto','Znesek',''];
  return `<div class="tw" style="margin-top:8px"><table class="lines" data-kind="${kind}"><thead><tr>${head.map((h,i)=>`<th class="${h==='Znesek'?'r':''}">${h}</th>`).join('')}</tr></thead><tbody>${lines.map(l=>lineRow(l,kind)).join('')}</tbody></table></div><div class="row" style="margin-top:8px"><button class="btn sm" data-a="lnAdd" type="button">＋ Dodaj postavko</button></div><div class="tot" id="tots"></div>`}
function readLines(root){return $$('tr.ln',root).map(tr=>{const g=c=>{const e=$(`[data-c="${c}"]`,tr);return e?e.value:''};return{itemId:g('item'),name:g('name'),qty:num(g('qty')),unit:g('unit'),price:num(g('price')),disc:num(g('disc')),vat:num(g('vat')),account:g('account')}})}
function recalc(root){
  const kind=$('.lines',root).dataset.kind;const trs=$$('tr.ln',root);const L=readLines(root);
  L.forEach((l,i)=>{$('[data-c="amt"]',trs[i]).textContent=fnum(r2(l.qty*l.price*(1-(l.disc||0)/100)))});
  const c=calc(L);const rates=Object.keys(c.by).sort((a,b)=>b-a);
  $('#tots',root).innerHTML=`<div><span>Osnova</span><span class="num">${fmt(c.net)}</span></div>${rates.map(k=>`<div class="mute"><span>DDV ${fnum(k,1)} % od ${fmt(c.by[k].net)}</span><span class="num">${fmt(c.by[k].vat)}</span></div>`).join('')}<div class="g"><span>Za plačilo</span><span class="num">${fmt(c.gross)}</span></div>`}
document.addEventListener('input',e=>{const r=e.target.closest&&e.target.closest('.lines');if(r)recalc(e.target.closest('.mbd'))});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.c==='item'){const tr=t.closest('tr');const it=DB.items.find(i=>i.id===t.value);const kind=t.closest('.lines').dataset.kind;
    if(it){$('[data-c="name"]',tr).value=it.name;const u=$('[data-c="unit"]',tr);if(u)u.value=it.unit;$('[data-c="price"]',tr).value=kind==='out'?it.price:(it.cost||it.price);const v=$('[data-c="vat"]',tr);if(S().vatPayer)v.value=String(it.vat);}
    recalc(t.closest('.mbd'))}
  if(t.name==='date'||t.name==='partnerId'){const m=t.closest('.mbd');if(!m||!$('[name="dueDate"]',m))return;const dt=$('[name="date"]',m).value;const pp=gp($('[name="partnerId"]',m)&&$('[name="partnerId"]',m).value);$('[name="dueDate"]',m).value=addDays(dt,+pp.due||S().dueDays);const sd=$('[name="serviceDate"]',m);if(sd&&t.name==='date')sd.value=dt}
});

const pOpts=(kind,sel)=>{const ok=kind==='out'?['kupec','oba']:['dobavitelj','oba'];return opt([['','— izberite —'],...DB.partners.filter(p=>ok.includes(p.type)||p.id===sel).sort((a,b)=>a.name.localeCompare(b.name,'sl')).map(p=>[p.id,p.name])],sel)};

function docEditor(kind,id,type,pre){
  const list=kind==='out'?DB.invoices:DB.received;
  let inv=id?list.find(x=>x.id===id):Object.assign({type:type||'racun',number:kind==='out'?nextNumber(type||'racun',today()):'',date:today(),serviceDate:today(),dueDate:addDays(today(),S().dueDays),partnerId:'',lines:[blankLine()],note:'',payments:[]},pre||{});
  const isNew=!id;
  const body=`<div class="f">${kind==='out'?(isNew?F.s('Vrsta dokumenta','type',inv.type,Object.entries(DT),'c3'):`<div class="c3"><label>Vrsta</label><input value="${DT[inv.type]}" disabled></div>`):''}${F.t(kind==='out'?'Številka':'Številka računa dobavitelja','number',inv.number,kind==='out'?'c3':'c4')}
  <div class="${kind==='out'?'c6':'c8'}"><label>${kind==='out'?'Kupec':'Dobavitelj'}</label><div class="row" style="flex-wrap:nowrap"><select name="partnerId">${pOpts(kind,inv.partnerId)}</select><button class="btn" type="button" data-a="qPartner" data-kind="${kind}" title="Nov partner">＋</button></div></div>
  ${F.d('Datum izdaje','date',inv.date,'c3')}${kind==='out'?F.d('Datum storitve','serviceDate',inv.serviceDate||inv.date,'c3'):''}${F.d('Zapadlost','dueDate',inv.dueDate,'c3')}${kind==='out'?F.t('Sklic','ref',inv.ref||'','c3','placeholder="samodejno"'):''}</div>
  ${linesTable(inv.lines&&inv.lines.length?inv.lines:[blankLine()],kind)}
  <div class="f" style="margin-top:14px">${F.a(kind==='out'?'Opomba na dokumentu':'Opomba','note',inv.note)}${kind==='out'?F.a('Interna opomba (se ne natisne)','internal',inv.internal||''):''}</div>`;
  const foot=`<button class="btn" data-a="mclose">Prekliči</button>${kind==='out'?'<button class="btn" id="dsv2">Shrani in predogled</button>':''}<button class="btn pri" id="dsv">Shrani</button>`;
  const el=modal((isNew?'Nov ':'Uredi ')+(kind==='out'?DT[inv.type].toLowerCase():'prejeti račun'),body,{w:1,foot,nofocus:0});
  recalc(el);
  const doSave=(view)=>{
    const d=formData(el);const lines=readLines(el).filter(l=>l.name.trim()||l.price);
    if(!d.partnerId){toast('Izberite '+(kind==='out'?'kupca':'dobavitelja')+'.');return}
    if(!lines.length){toast('Dodajte vsaj eno postavko.');return}
    if(!d.number.trim()){toast('Vnesite številko dokumenta.');return}
    if(d.dueDate<d.date){toast('Zapadlost ne sme biti pred datumom izdaje.');return}
    const dup=list.find(x=>x.number===d.number&&x.id!==inv.id&&(kind==='in'?x.partnerId===d.partnerId:x.type===(d.type||inv.type)));if(dup){toast('Dokument s to številko že obstaja.');return}
    const t=d.type||inv.type;
    if(kind==='out'){
      Object.assign(inv,{type:t,number:d.number,partnerId:d.partnerId,date:d.date,serviceDate:d.serviceDate,dueDate:d.dueDate,ref:d.ref||siRef(d.number),lines,note:d.note,internal:d.internal});
      if(isNew){inv.id=uid();DB.invoices.push(inv);if(inv.srcId){const sc=gi(inv.srcId);if(sc)sc.state='Pretvorjen v račun'}}
      if(['racun','dobavnica'].includes(inv.type)&&!inv.noStock)syncMoves(inv.id,inv.number,inv.date,lines,-1,'Izdani dokument');
      logA((isNew?'Izdan ':'Urejen ')+DT[inv.type].toLowerCase()+' '+inv.number);
    }else{
      Object.assign(inv,{number:d.number,partnerId:d.partnerId,date:d.date,dueDate:d.dueDate,lines,note:d.note});
      if(isNew){inv.id=uid();inv.payments=[];DB.received.push(inv)}
      syncMoves(inv.id,inv.number,inv.date,lines,1,'Prejeti račun');
      lines.forEach(l=>{const it=DB.items.find(x=>x.id===l.itemId);if(it&&l.price)it.cost=l.price});
      logA((isNew?'Vnesen ':'Urejen ')+'prejeti račun '+inv.number);
    }
    save();closeModal();refresh();toast('Shranjeno');if(view&&kind==='out')ACT.invView({id:inv.id})};
  $('#dsv',el).onclick=()=>doSave(false);const b2=$('#dsv2',el);if(b2)b2.onclick=()=>doSave(true);
  const ts=$('[name="type"]',el);if(ts)ts.onchange=()=>{$('[name="number"]',el).value=nextNumber(ts.value,$('[name="date"]',el).value)};
}

function invList(){
  const ty=gv('itype','racun'),st=gv('ist',''),yr=gv('iyr',''),q=gv('iq','').toLowerCase();
  let rows=DB.invoices.filter(i=>(ty==='vsi'||i.type===ty)&&(!yr||i.date.startsWith(yr))&&(!q||(i.number+' '+pn(i.partnerId)).toLowerCase().includes(q)));
  if(st)rows=rows.filter(i=>{const s=invStatus(i)[0];return st==='odprti'?['Odprt','Delno plačan','Zapadel'].includes(s):s===st});
  rows.sort((a,b)=>b.date.localeCompare(a.date)||b.number.localeCompare(a.number));
  const years=[...new Set(DB.invoices.map(i=>i.date.slice(0,4)).concat([today().slice(0,4)]))].sort().reverse();
  const rac=DB.invoices.filter(i=>i.type==='racun'&&!i.cancelled);
  const open=r2(rac.reduce((s,i)=>s+invOpen(i),0)),over=r2(rac.filter(i=>i.dueDate<today()).reduce((s,i)=>s+Math.max(0,invOpen(i)),0));
  const sum=r2(rows.filter(i=>!i.cancelled).reduce((s,i)=>s+tot(i).gross*sgn(i),0));
  const cols=[{h:'Številka',f:i=>`<a href="#" data-a="invView" data-id="${i.id}" class="b" style="color:var(--acc);text-decoration:none">${esc(i.number)}</a>${ty==='vsi'?'<br><small class="mute">'+DT[i.type]+'</small>':''}`},{h:'Kupec',f:i=>esc(pn(i.partnerId))},{h:'Datum',f:i=>fd(i.date)},{h:'Zapadlost',f:i=>i.type==='racun'?fd(i.dueDate):''},{h:'Znesek',c:'r',f:i=>fmt(tot(i).gross*sgn(i))},{h:'Odprto',c:'r',f:i=>i.type==='racun'&&!i.cancelled?(invOpen(i)?`<b>${fmt(invOpen(i))}</b>`:'—'):''},{h:'Status',f:i=>{const s=invStatus(i);return tag(s[0],s[1])+(i.reminders?` <small class="mute">opomin ×${i.reminders}</small>`:'')}},{h:'',c:'r',f:i=>`${i.type==='racun'&&!i.cancelled&&invOpen(i)>0?`<button class="btn sm" data-a="invPay" data-id="${i.id}">Plačilo</button> `:''}<button class="btn sm" data-a="invView" data-id="${i.id}">Ogled</button> <button class="btn sm" data-a="invEdit" data-id="${i.id}">Uredi</button>`}];
  return `<div class="ph"><h2>Izdani dokumenti</h2><span class="sp"></span><button class="btn" data-a="invCsv">Izvoz CSV</button><button class="btn pri" data-a="invNew" data-type="${ty==='vsi'?'racun':ty}">＋ Nov ${DT[ty==='vsi'?'racun':ty].toLowerCase()}</button></div>
  ${ty==='racun'||ty==='vsi'?`<div class="grid g4" style="margin-bottom:14px"><div class="card kpi amb"><span>Odprte terjatve</span><b>${fmt(open)}</b></div><div class="card kpi red"><span>Od tega zapadlo</span><b>${fmt(over)}</b></div><div class="card kpi blu"><span>Vsota prikazanih</span><b>${fmt(sum)}</b></div></div>`:''}
  ${tabs('itype',[['racun','Računi'],['predracun','Predračuni'],['ponudba','Ponudbe'],['dobropis','Dobropisi'],['dobavnica','Dobavnice'],['vsi','Vsi']],'racun')}
  <div class="tools"><input class="grow" data-f="iq" placeholder="Išči po številki ali kupcu …" value="${esc(gv('iq',''))}"><select data-f="ist">${opt([['','Vsi statusi'],['odprti','Odprti'],['Zapadel','Zapadli'],['Plačan','Plačani'],['Storniran','Stornirani']],st)}</select><select data-f="iyr">${opt([['','Vsa leta'],...years],yr)}</select></div>

  return `<div class="bars">${R.map((r,i)=>`<div class="bc"><div class="pair"><i style="height:${Math.max(1,Math.round(r/mx*100))}%;background:var(--acc)" title="Prihodki ${MES3[i]}: ${fmt(r)}"></i><i style="height:${Math.max(1,Math.round(C[i]/mx*100))}%;background:var(--amb)" title="Stroški ${MES3[i]}: ${fmt(C[i])}"></i></div><small>${MES3[i]}</small></div>`).join('')}</div><div class="leg"><span><i style="background:var(--acc)"></i>Prihodki</span><span><i style="background:var(--amb)"></i>Stroški</span></div>`}

  <div class="ph"><h2>Pozdravljeni</h2><span class="sp"></span><button class="btn pri" data-a="invNew" data-type="racun">＋ Nov račun</button><button class="btn" data-a="invNew" data-type="predracun">Nov predračun</button><button class="btn" data-a="rcvNew">Vnesi prejeti račun</button><button class="btn" data-a="cNew" data-k="partners">Nova stranka</button></div>

/* ================= Banka ================= */
const parseDate=s=>{s=String(s).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:''};
const parseAmt=s=>{s=String(s).replace(/[€\s]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return parseFloat(s)||0};
function openDocs(kind){return kind==='out'?DB.invoices.filter(i=>i.type==='racun'&&!i.cancelled&&invOpen(i)>0.005):DB.received.filter(i=>recvOpen(i)>0.005)}
function linkTxn(k,tx,kind,doc,srcType){const amt=Math.abs(tx.amount);doc.payments=doc.payments||[];doc.payments.push({id:uid(),date:tx.date,amount:amt,method:srcType==='banka'?'TRR':'gotovina',src:tx.id,srcType});tx.link={kind,id:doc.id}}
function autoMatch(){let n=0;DB.bank.forEach(b=>{if(b.link||b.konto)return;const kind=b.amount>0?'out':'in';const txt=(b.desc+' '+b.ref).toLowerCase();const c=openDocs(kind);
  let hit=c.find(i=>txt.includes(String(i.number).toLowerCase()));
  if(!hit){const same=c.filter(i=>Math.abs((kind==='out'?invOpen(i):recvOpen(i))-Math.abs(b.amount))<0.005);if(same.length===1)hit=same[0]}
  if(hit){linkTxn('bank',b,kind,hit,'banka');n++}});save();return n}
PAGES.banka={t:'Banka',ic:'🏦',r:()=>{
  const q=gv('bq','').toLowerCase(),st=gv('bst','');let rows=DB.bank.filter(b=>(!q||(b.desc+' '+b.partner+' '+b.ref).toLowerCase().includes(q))&&(!st||(st==='ne'?!b.link&&!b.konto:!!(b.link||b.konto))));rows.sort((a,b)=>b.date.localeCompare(a.date));
  const un=DB.bank.filter(b=>!b.link&&!b.konto).length;
  return `<div class="ph"><h2>Bančni izpiski</h2><span class="sp"></span><button class="btn" data-a="bankAuto">⚡ Samodejno poveži</button><button class="btn" data-a="bankImport">Uvoz izpiska (CSV)</button><button class="btn pri" data-a="bankNew">＋ Ročna transakcija</button></div>
  <div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><span>Stanje na TRR</span><b>${fmt(bankBal())}</b></div><div class="card kpi amb"><span>Nepovezane transakcije</span><b>${un}</b></div></div>
  <div class="tools"><input class="grow" data-f="bq" placeholder="Išči …" value="${esc(gv('bq',''))}"><select data-f="bst">${opt([['','Vse'],['ne','Nepovezane'],['da','Povezane / knjižene']],st)}</select></div>
  ${tbl([{h:'Datum',f:b=>fd(b.date)},{h:'Partner / namen',f:b=>`<b>${esc(b.partner||'')}</b><br><small class="mute">${esc(b.desc)} ${esc(b.ref)}</small>`},{h:'Znesek',c:'r',f:b=>`<b class="${b.amount<0?'neg':'pos'}">${fmt(b.amount)}</b>`},{h:'Status',f:b=>b.link?tag('Poravnan: '+esc((b.link.kind==='out'?gi(b.link.id):gr(b.link.id))?.number||'?'),'g'):b.konto?tag('Knjiženo: '+b.konto,'b'):tag('Nepovezano','a')},{h:'',c:'r',f:b=>`${!b.link&&!b.konto?`<button class="btn sm" data-a="bankLink" data-id="${b.id}">Poveži z računom</button> <button class="btn sm" data-a="bankBook" data-id="${b.id}">Knjiži</button> `:`<button class="btn sm" data-a="bankUnlink" data-id="${b.id}">Razveži</button> `}<button class="btn sm dng" data-a="bankDel" data-id="${b.id}">✕</button>`}],rows,{empty:'Ni transakcij. Uvozite CSV izpisek ali dodajte transakcijo ročno.'})}`}};
Object.assign(ACT,{
 bankAuto:()=>{const n=autoMatch();refresh();toast(n?`Samodejno povezanih: ${n}`:'Ni novih ujemanj.')},
 bankNew:()=>{const el=modal('Nova bančna transakcija',`<div class="f">${F.d('Datum','date',today(),'c4')}${F.n('Znesek (odliv negativno)','amount','','c4')}${F.t('Partner','partner','','c4')}${F.t('Namen','desc','','c8')}${F.t('Sklic','ref','','c4')}</div>`,{foot:'<button class="btn" data-a="mclose">Prekliči</button><button class="btn pri" id="bsv">Shrani</button>'});
  $('#bsv',el).onclick=()=>{const d=formData(el);d.amount=num(d.amount);if(!d.amount){toast('Vnesite znesek.');return}d.id=uid();DB.bank.push(d);save();closeModal();refresh()}},
 bankImport:()=>{const el=modal('Uvoz bančnega izpiska',`<p class="mute">Naložite CSV ali prilepite vrstice: <code>datum;znesek;partner;namen;sklic</code>. Datum: 31. 1. 2026 ali 2026-01-31. Znesek: 1.234,56 (odlivi z minusom).</p><input type="file" id="bfile" accept=".csv,.txt"><textarea id="btxt" style="width:100%;min-height:180px;margin-top:10px;font-family:monospace"></textarea>`,{foot:'<button class="btn" data-a="mclose">Prekliči</button><button class="btn pri" id="bgo">Uvozi</button>'});
  $('#bfile',el).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#btxt',el).value=r.result};r.readAsText(f,'utf-8')};
  $('#bgo',el).onclick=()=>{let n=0,sk=0;$('#btxt',el).value.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const c=l.split(l.includes(';')?';':',').map(x=>x.trim().replace(/^"|"$/g,''));const date=parseDate(c[0]);if(!date){sk++;return}const amt=parseAmt(c[1]);if(!amt){sk++;return}const dup=DB.bank.some(b=>b.date===date&&b.amount===amt&&b.desc===(c[3]||'')&&b.ref===(c[4]||''));if(dup){sk++;return}DB.bank.push({id:uid(),date,amount:amt,partner:c[2]||'',desc:c[3]||'',ref:c[4]||''});n++});const m=autoMatch();closeModal();refresh();toast(`Uvoženo: ${n}, preskočeno: ${sk}, samodejno povezanih: ${m}`)}},
 bankLink:d=>{const b=DB.bank.find(x=>x.id===d.id);const kind=b.amount>0?'out':'in';const docs=openDocs(kind).sort((a,c)=>Math.abs((kind==='out'?invOpen(a):recvOpen(a))-Math.abs(b.amount))-Math.abs((kind==='out'?invOpen(c):recvOpen(c))-Math.abs(b.amount)));
  const el=modal('Poveži transakcijo '+fmt(b.amount),`<p class="mute">${esc(b.partner)} ${esc(b.desc)} ${esc(b.ref)}</p>${docs.length?`<div class="f"><div class="c12"><label>${kind==='out'?'Odprt izdani račun':'Odprt prejeti račun'}</label><select name="doc">${docs.map(i=>`<option value="${i.id}">${esc(i.number)} · ${esc(pn(i.partnerId))} · odprto ${fmt(kind==='out'?invOpen(i):recvOpen(i))}</option>`).join('')}</select></div></div>`:'<div class="empty">Ni odprtih računov za povezavo.</div>'}`,{foot:`<button class="btn" data-a="mclose">Prekliči</button>${docs.length?'<button class="btn pri" id="blsv">Poveži</button>':''}`});
  const s=$('#blsv',el);if(s)s.onclick=()=>{const doc=docs.find(x=>x.id===$('[name=doc]',el).value);linkTxn('bank',b,kind,doc,'banka');save();closeModal();refresh();toast('Povezano')}},
 bankBook:d=>{const b=DB.bank.find(x=>x.id===d.id);const accs=DB.accounts.filter(a=>b.amount>0?/^[7]|^9|^1|^2/.test(a.code):/^[4]|^2|^0/.test(a.code));
  const el=modal('Knjiži transakcijo '+fmt(b.amount),`<div class="f">${F.s('Konto nasproti','konto',b.amount>0?'764':'419',accs.map(a=>[a.code,a.code+' '+a.name]),'c12')}</div>`,{foot:'<button class="btn" data-a="mclose">Prekliči</button><button class="btn pri" id="bksv">Knjiži</button>'});
  $('#bksv',el).onclick=()=>{b.konto=$('[name=konto]',el).value;save();closeModal();refresh()}},
 bankUnlink:d=>{const b=DB.bank.find(x=>x.id===d.id);[...DB.invoices,...DB.received].forEach(i=>{i.payments=(i.payments||[]).filter(p=>p.src!==b.id)});delete b.link;delete b.konto;save();refresh()},
 bankDel:d=>confirmDlg('Izbrišem transakcijo? Povezano plačilo bo odstranjeno.',()=>{ACT.bankUnlink(d);DB.bank=DB.bank.filter(x=>x.id!==d.id);save();refresh()})
});

PAGES.blagajna={t:'Blagajna',ic:'💵',r:()=>{
  const y=gv('cy',today().slice(0,4));const rows=DB.cash.filter(c=>c.date.startsWith(y)).sort((a,b)=>a.date.localeCompare(b.date)||0);
  let bal=S().cashOpening+DB.cash.filter(c=>c.date<y+'-01-01').reduce((s,c)=>s+(c.type==='prejemek'?1:-1)*c.amount,0);const start=bal;
  const body=rows.map(c=>{bal=r2(bal+(c.type==='prejemek'?c.amount:-c.amount));return{c,bal}});
  const years=[...new Set(DB.cash.map(c=>c.date.slice(0,4)).concat([today().slice(0,4)]))].sort().reverse();
  return `<div class="ph"><h2>Blagajniški dnevnik</h2><span class="sp"></span><button class="btn" data-a="cashPrint">Natisni</button><button class="btn pri" data-a="cashNew">＋ Nov vnos</button></div>

  <div class="tools"><select data-f="cy">${opt(years,y)}</select></div>
  ${tbl([{h:'Št.',f:o=>esc(o.c.number)},{h:'Datum',f:o=>fd(o.c.date)},{h:'Opis',f:o=>esc(o.c.desc)+(o.c.link?` <small class="mute">→ ${esc((o.c.link.kind==='out'?gi(o.c.link.id):gr(o.c.link.id))?.number||'')}</small>`:'')},{h:'Prejemek',c:'r',f:o=>o.c.type==='prejemek'?fmt(o.c.amount):''},{h:'Izdatek',c:'r',f:o=>o.c.type==='izdatek'?fmt(o.c.amount):''},{h:'Stanje',c:'r',f:o=>`<b>${fmt(o.bal)}</b>`},{h:'',c:'r',f:o=>`<button class="btn sm dng" data-a="cashDel" data-id="${o.c.id}">✕</button>`}],body,{foot:`<tr><td colspan="5">Začetno stanje ${y}: ${fmt(start)}</td><td class="r">${fmt(bal)}</td><td></td></tr>`,empty:'V tem letu ni blagajniških vnosov.'})}`}};

const BLK='div,table,ul,ol,h1,h2,h3,p,.card,.grid';
function walk(el,B,st){
  for(const c of el.children){

    if(c.matches('.ph')){const h=$('h2',c);if(h&&!st.title)st.title=norm(h.textContent);continue}
    if(c.matches('.tools')){$$('select,input',c).forEach(x=>{if(x.tagName==='SELECT'){const f=norm(x.options[0]?.text);if(x.selectedIndex>0||!/^(Vsi|Vsa|Vse)/.test(f))st.filt.push(norm(x.options[x.selectedIndex]?.text))}else if(x.value&&x.type!=='file')st.filt.push(x.type==='date'?fd(x.value):x.value)});continue}
    if(c.matches('script,style,button,input,select,textarea,label,.mf,.mh,.prog,.leg,.gsr,.doc,[hidden]'))continue;
    if(c.matches('h1,h2,h3')){B.push({t:'h',x:norm(c.textContent),l:c.tagName==='H3'?2:1});continue}
    if(c.matches('.note')){B.push({t:'note',x:norm(c.textContent)});continue}
    if(c.matches('table')){B.push(scrapeTable(c));continue}
    if(c.matches('.tw')){const t=$('table',c);B.push(t?scrapeTable(t):{t:'p',x:norm(c.textContent)});continue}
    if(c.matches('.bars')){const rows=$$('.bc',c).map(b=>{const is=$$('i',b);const v=i=>((is[i]?.title||'').split(': ')[1]||'');return[norm($('small',b)?.textContent),v(0),v(1)]});B.push({t:'table',head:['Mesec','Prihodki','Stroški'],rows,foot:[]});continue}
    if(c.matches('ul.list')){B.push({t:'table',head:[],rows:$$('li',c).map(li=>[...li.children].map(x=>{const k=x.cloneNode(true);$$('br',k).forEach(b=>b.replaceWith(' · '));return norm(k.textContent)})),foot:[]});continue}
    if(c.matches('.grid')&&c.children.length&&[...c.children].every(x=>x.matches('.kpi'))){B.push({t:'kv',rows:[...c.children].map(k=>[norm($('span',k)?.textContent),norm($('b',k)?.textContent)+($('small',k)?' ('+norm($('small',k).textContent)+')':'')])});continue}

  return `<div class="rep doc">${r.noHead?'':`<div class="rh"><b>${esc(co.name)}</b><span>Izpis: ${new Date().toLocaleString('sl-SI')}</span></div><h1>${esc(r.title)}</h1>${r.sub?`<div class="sub">${esc(r.sub)}</div>`:''}${r.filt?`<div class="sub">Filter: ${esc(r.filt)}</div>`:''}`}${r.blocks.map(b=>{
    if(b.t==='h')return `<h${b.l===2?3:2}>${esc(b.x)}</h${b.l===2?3:2}>`;
    if(b.t==='p')return `<p style="${b.b?'font-weight:700;':''}${b.sz?`font-size:${b.sz/2}px;`:''}${b.color?'color:#'+b.color+';':''}">${esc(b.x)}</p>`;
    if(b.t==='note')return `<div class="note">${esc(b.x)}</div>`;
    if(b.t==='kv')return `<table class="rt kv">${b.rows.map(r=>`<tr><th>${esc(r[0])}</th><td${b.right||isNumTxt(r[1])?' class="r"':''}>${esc(r[1])}</td></tr>`).join('')}</table>`;
    if(b.t==='table')return tb(b);return ''}).join('')}</div>`}
function printReport(r,orient){
  const o=orient&&orient!=='auto'?orient:autoOrient(r);

const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    chunks.push(lh,d);

    off+=lh.length+d.length});
  const cds=cd.reduce((s,c)=>s+c.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cds),...u32(off),0,0]);

const xe=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function colWidths(head,rows,total,w){const n=head.length||(rows[0]||[]).length;if(w&&w.length===n){const s=w.reduce((a,b)=>a+b,0);const r=w.map(x=>Math.floor(total*x/s));r[n-1]+=total-r.reduce((a,b)=>a+b,0);return r}
  const L=[];for(let i=0;i<n;i++){let m=(head[i]||'').length;rows.forEach(r=>{m=Math.max(m,Math.min(String(r[i]||'').length,60))});L.push(m+7)}const s=L.reduce((a,b)=>a+b,0);const r=L.map(x=>Math.max(500,Math.floor(total*x/s)));const s2=r.reduce((a,b)=>a+b,0);const r2_=r.map(x=>Math.floor(x*total/s2));r2_[n-1]+=total-r2_.reduce((a,b)=>a+b,0);return r2_}
function buildDocx(r,orient){

function ibanOk(s){s=String(s||'').replace(/\s+/g,'').toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return false;if(s.startsWith('SI')&&s.length!==19)return false;const r=s.slice(4)+s.slice(0,4);let rem=0;for(const ch of r){const v=ch>='A'?ch.charCodeAt(0)-55:+ch;rem=(rem*(v>9?100:10)+v)%97}return rem===1}

function deadlines(){

    if(S().vatPayer){E.push({date:lastWorkday(y,m),name:`DDV-O za ${MESECI[pm.getMonth()]} ${pm.getFullYear()}`,note:'Oddaja obračuna DDV v eDavkih (mesečni zavezanec). Preverite obdobje in dela proste dneve.'});
      E.push({date:`${y}-${pad(m)}-20`,name:`RP-O in evidence DDV za ${MESECI[pm.getMonth()]}`,note:'Če opravljate dobave v EU oziroma vam to nalaga ZDDV-1O.'})}}
  for(let y=d0.getFullYear()-1;y<=d0.getFullYear()+1;y++){
    E.push({date:`${y}-01-31`,name:`Povzetek obračuna dohodkov za ${y-1}`,note:'337. člen ZDavP-2: izročitev prejemnikom dohodka.'});
    E.push({date:`${y}-03-31`,name:`Obračun davka (DDPO / dohodek iz dejavnosti) za ${y-1}`,note:'Oddaja v eDavkih.'});
    E.push({date:`${y}-04-30`,name:`Doplačilo davka po obračunu za ${y-1}`,note:'Rok za doplačilo je vezan na zakonski rok oddaje.'})}

  return E.filter(e=>e.date>=addDays(t,-1)&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date))}

 orgSwitch:d=>{loadOrg(d.id);document.documentElement.dataset.theme=DB.settings.theme;buildNav();render()},
 orgNew:()=>{const el=modal('Nova organizacija',`<div class="f">${F.t('Naziv','name','','c12')}</div>`,{foot:'<button class="btn" data-a="mclose">Prekliči</button><button class="btn pri" id="onsv">Ustvari</button>'});$('#onsv',el).onclick=()=>{const n=$('[name=name]',el).value.trim();if(!n){toast('Vnesite naziv.');return}const id=uid();ROOT.orgs.push({id,name:n});DB=newDB();DB.settings.company.name=n;ROOT.cur=id;save();saveRoot();closeModal();buildNav();render()}},
 orgRename:d=>{const o=ROOT.orgs.find(x=>x.id===d.id);const n=prompt('Novo ime organizacije',o.name);if(n&&n.trim()){o.name=n.trim();saveRoot();buildNav();refresh()}},
 orgDel:d=>confirmDlg('Izbrišem organizacijo in vse njene podatke?',()=>{ls.del('mmx_org_'+d.id);ROOT.orgs=ROOT.orgs.filter(o=>o.id!==d.id);if(ROOT.cur===d.id)loadOrg(ROOT.orgs[0].id);saveRoot();buildNav();render()}),
 dataWipe:()=>confirmDlg('Izbrišem VSE podatke te organizacije? Priporočamo, da najprej izvozite kopijo.',()=>{const n=CO().name;DB=newDB();DB.settings.company.name=n;save();buildNav();render();toast('Podatki izbrisani')},'Izprazni'),
 demoLoad:()=>confirmDlg('Demo podatki se bodo dodali obstoječim.',()=>{seedDemo(true);save();render();toast('Demo podatki dodani')},'Dodaj')
});
document.addEventListener('change',e=>{if(e.target.id==='orgsel'){loadOrg(e.target.value);document.documentElement.dataset.theme=DB.settings.theme;buildNav();render()}});

/* ================= Globalno iskanje ================= */
document.addEventListener('input',e=>{if(e.target.id!=='gsi')return;const q=e.target.value.trim().toLowerCase();const box=$('#gsr');if(q.length<2){box.hidden=true;return}
  const R=[];DB.partners.filter(p=>(p.name+p.taxId+p.email).toLowerCase().includes(q)).slice(0,4).forEach(p=>R.push(['pCard',p.id,p.name,'Partner']));
  DB.invoices.filter(i=>(i.number+pn(i.partnerId)).toLowerCase().includes(q)).slice(0,5).forEach(i=>R.push(['invView',i.id,DT[i.type]+' '+i.number,pn(i.partnerId)+' · '+fmt(tot(i).gross)]));
  DB.received.filter(i=>(i.number+pn(i.partnerId)).toLowerCase().includes(q)).slice(0,4).forEach(i=>R.push(['rcvView',i.id,'Prejeti '+i.number,pn(i.partnerId)]));
  DB.items.filter(i=>(i.name+i.code).toLowerCase().includes(q)).slice(0,3).forEach(i=>R.push(['cEdit',i.id,i.name,'Artikel']));
  box.innerHTML=R.length?R.map(r=>`<a data-a="gsGo" data-act="${r[0]}" data-id="${r[1]}"${r[0]==='cEdit'?' data-k="items"':''}>${esc(r[2])}<br><small>${esc(r[3])}</small></a>`).join(''):'<a><small>Ni zadetkov</small></a>';box.hidden=false});
ACT.gsGo=d=>{$('#gsr').hidden=true;$('#gsi').value='';ACT[d.act](d)};
document.addEventListener('click',e=>{if(!e.target.closest('.gs')){const b=$('#gsr');if(b)b.hidden=true}});

/* ================= Demo podatki ================= */
function seedDemo(add){
  const c=DB.settings.company;if(!add){Object.assign(c,{name:'Demo d.o.o.',address:'Slovenska ulica 12',zip:'2250',city:'Ptuj',taxId:'12345678',vatId:'SI12345678',reg:'Vpisano v AJPES',iban:'SI35 0123 4567 8901 234',bic:'DEMOSI2X',bank:'Demo banka d.d.',email:'info@demo.si',phone:'02 123 45 67',web:'www.demo.si'});DB.settings.bankOpening=6500;DB.settings.cashOpening=250}
  const P=(name,type,city,tax,mail,zip='1000')=>{const p={id:uid(),name,type,taxId:tax,vatId:'SI'+tax,address:'Glavna cesta '+(10+DB.partners.length),zip,city,country:'Slovenija',email:mail,phone:'',iban:'',due:'',note:''};DB.partners.push(p);return p.id};
  const k=[P('Alpina trgovina d.o.o.','kupec','Ljubljana','23456789','racuni@alpina.si'),P('Mesto Ptuj','kupec','Ptuj','34567890','fin@ptuj.si','2250'),P('Grafika Zajc s.p.','kupec','Maribor','45678901','zajc@grafika.si','2000'),P('Terme Boč d.o.o.','kupec','Poljčane','56789012','info@terme.si','2319'),P('Studio Luna d.o.o.','kupec','Celje','67890123','studio@luna.si','3000')];
  const d=[P('Najemodajalec Poslovni center','dobavitelj','Ptuj','78901234','najem@pc.si','2250'),P('Pisarna Plus d.o.o.','dobavitelj','Ljubljana','89012345','narocila@pisarna.si'),P('Telekom Prosto d.o.o.','dobavitelj','Ljubljana','90123456','info@telekom.si')];
  const I=(code,name,type,unit,price,cost,track,min)=>{const it={id:uid(),code,name,type,unit,price,cost,vat:22,track,min,account:type==='blago'?'762':'760',note:''};DB.items.push(it);return it};
  const sv1=I('S-001','Svetovanje in podpora','storitev','ura',55,0,false,0),sv2=I('S-002','Izdelava spletne strani','storitev','kos',1800,0,false,0),sv3=I('S-003','Mesečno vzdrževanje','storitev','mes.',120,0,false,0);
  const g1=I('B-001','Prenosni računalnik 15"','blago','kos',890,640,true,3),g2=I('B-002','Brezžična miška','blago','kos',24,11,true,10),g3=I('B-003','Monitor 27"','blago','kos',290,190,true,4);
  const mk=(dt,it)=>{DB.moves.push({id:uid(),date:dt,itemId:it.id,qty:it===g2?60:12,type:'Prevzem',doc:'Začetna zaloga',note:''})};const first=addMonths(today().slice(0,8)+'01',-10);[g1,g2,g3].forEach(i=>mk(first,i));
  const now=today();const base=now.slice(0,8)+'01';let n=0;
  for(let m=9;m>=0;m--){[4,17].forEach((dd,j)=>{const dt=addDays(addMonths(base,-m),dd);if(dt>now)return;n++;const pid=k[(n+j)%5];const lines=[];const sel=n%4;
    if(sel===0)lines.push({itemId:sv1.id,name:sv1.name,qty:8+n%9,unit:'ura',price:55,disc:0,vat:22});
    if(sel===1){lines.push({itemId:g1.id,name:g1.name,qty:1+n%3,unit:'kos',price:890,disc:0,vat:22});lines.push({itemId:g2.id,name:g2.name,qty:2,unit:'kos',price:24,disc:5,vat:22})}
    if(sel===2)lines.push({itemId:sv3.id,name:sv3.name,qty:1,unit:'mes.',price:120,disc:0,vat:22},{itemId:sv1.id,name:sv1.name,qty:4,unit:'ura',price:55,disc:0,vat:22});
    if(sel===3){lines.push({itemId:sv2.id,name:sv2.name,qty:1,unit:'kos',price:1800,disc:0,vat:22});if(n%8===3)lines.push({itemId:g3.id,name:g3.name,qty:1,unit:'kos',price:290,disc:0,vat:22})}
    const num_=nextNumber('racun',dt);const inv={id:uid(),type:'racun',number:num_,date:dt,serviceDate:dt,dueDate:addDays(dt,15),partnerId:pid,lines,note:'Hvala za zaupanje.',payments:[],ref:siRef(num_)};
    const unpaid=(m===1&&j===1)||m===0||(m===2&&j===0);if(!unpaid){const pd=addDays(dt,15+(n%6));if(pd<=now)inv.payments.push({id:uid(),date:pd,amount:tot(inv).gross,method:'TRR'})}
    DB.invoices.push(inv);syncMoves(inv.id,inv.number,dt,lines,-1,'Izdani dokument')})}
  for(let m=9;m>=0;m--){const dt=addDays(addMonths(base,-m),1);if(dt>now)continue;
    const r1={id:uid(),number:'NAJ-'+dt.slice(0,7),partnerId:d[0],date:dt,dueDate:addDays(dt,8),lines:[{itemId:'',name:'Najem poslovnega prostora',qty:1,price:450,vat:22,account:'412'}],payments:[],note:''};if(m>0)r1.payments.push({id:uid(),date:addDays(dt,7),amount:tot(r1).gross,method:'TRR'});DB.received.push(r1);
    const r2_={id:uid(),number:'TP-'+dt.slice(0,7),partnerId:d[2],date:addDays(dt,10),dueDate:addDays(dt,25),lines:[{itemId:'',name:'Telekomunikacijske storitve',qty:1,price:64.9,vat:22,account:'416'}],payments:[],note:''};if(m>0)r2_.payments.push({id:uid(),date:addDays(dt,24),amount:tot(r2_).gross,method:'TRR'});if(r2_.date<=now)DB.received.push(r2_)}
  const pr={id:uid(),number:'PP-'+(2000+DB.received.length),partnerId:d[1],date:addDays(now,-12),dueDate:addDays(now,3),lines:[{itemId:'',name:'Pisarniški material',qty:1,price:186.4,vat:22,account:'403'}],payments:[],note:''};DB.received.push(pr);
  const emp={id:uid(),name:'Maja Novak',taxId:'11223344',position:'Razvijalka',gross:2600,start:addMonths(base,-10),extraRelief:0,noTax:false,iban:''};DB.employees.push(emp);
  for(let m=2;m>=1;m--)DB.payrolls.push({id:uid(),employeeId:emp.id,month:addMonths(base,-m).slice(0,7),gross:2600,mealDays:20,commute:0,extraRelief:0,noTax:false});
  DB.assets.push({id:uid(),code:'OS-001',name:'Strežnik Dell',date:addMonths(base,-8),cost:2400,rate:33.33,note:''});
  DB.travel.push({id:uid(),who:'Maja Novak',purpose:'Sestanek s stranko',from:'Ptuj',to:'Ljubljana',date:addDays(now,-9),km:260,kmRate:0.43,days:1,dailyAmt:16.4,other:8,note:''});
  DB.recurring.push({id:uid(),partnerId:k[1],desc:'Mesečno vzdrževanje spletne strani',qty:1,price:120,vat:22,interval:1,next:addDays(now,-3),active:true});
  DB.cash.push({id:uid(),type:'izdatek',date:addDays(now,-20),amount:35.5,desc:'Kavni aparat – potrošni material',number:'BI-'+now.slice(0,4)+'-001',konto:'469'});
  const open=DB.invoices.filter(i=>invOpen(i)>0.005&&i.dueDate>=now).slice(-1)[0];
  if(open)DB.bank.push({id:uid(),date:addDays(now,-1),amount:invOpen(open),partner:pn(open.partnerId),desc:'Plačilo računa '+open.number,ref:open.ref});
  DB.bank.push({id:uid(),date:addDays(now,-2),amount:-4.9,partner:'Demo banka',desc:'Mesečni vodenja računa',ref:''});
  logA('Naloženi demo podatki');
}
